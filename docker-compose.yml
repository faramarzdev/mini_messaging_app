services:
  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

  queue:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=1
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

  reverb:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  redis:
    image: redis:7-alpine

volumes:
  postgres_data: